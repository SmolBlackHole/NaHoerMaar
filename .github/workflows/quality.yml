name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        name: Workspace on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: pyproject.toml

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install Linux audio dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libopus0

            - name: Set up project
              run: python scripts/dev.py setup

            - name: Run checks
              run: python scripts/dev.py check
