name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        name: Workspace
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: nahormaar_test
                    POSTGRES_USER: nahormaar
                    POSTGRES_PASSWORD: integration-test-only
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U nahormaar -d nahormaar_test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 12

        env:
            NAHORMAAR_POSTGRES_TEST_URL: postgresql+psycopg://nahormaar:integration-test-only@127.0.0.1:5432/nahormaar_test

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: pyproject.toml

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install audio dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libopus0

            - name: Set up project
              run: python scripts/dev.py setup

            - name: Run checks
              run: python scripts/dev.py check
