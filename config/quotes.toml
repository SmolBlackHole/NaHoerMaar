    "You can lose a person without losing what you learned through loving them.",
    "Grief is what love becomes when it can no longer reach the person it was meant for.",
    "One day you may look back at who you are now with more kindness than you are capable of giving yourself today.",
    "You do not have to remain the person you needed to become in order to survive a difficult time.",
    "Some answers arrive only after the question stops owning your life.",
    "Not everything that breaks should be repaired.",
    "Sometimes courage is nothing more dramatic than returning tomorrow.",
    "You do not need to know where the road ends to take the next honest step.",
    "The life you want is built mostly on ordinary days.",
    "Rest is not the same thing as standing still.",
    "A quiet life can still be a vast one.",
    "There are things you survive without ever needing to be grateful that they happened.",
    "You cannot change yesterday, but you can stop making tomorrow pay for it.",
    "Sometimes the bravest thing you can do is allow the future to be different from the past.",
    "You do not have to forgive the past to stop living inside it.",
